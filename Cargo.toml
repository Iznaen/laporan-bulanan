[package]
name = "laporan-bulanan"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
slint = { version = "1.17", features = ["backend-android-activity-06"] }
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = "0.4"
rust_xlsxwriter = "0.99.0"
genpdf = { version = "0.2.0", features = ["images"] }

[build-dependencies]
slint-build = "1.17"

[package.metadata.android]
package = "com.roguenine.laporan_bulanan"
build_targets = ["aarch64-linux-android", "x86_64-linux-android"]
apk_name = "LaporanBulanan"

[package.metadata.android.sdk]
target_sdk_version = 33
